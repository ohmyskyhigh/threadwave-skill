name: CI

on:
  push:
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: npm run artifacts
      - run: cmp release-index.json dist/release-index.candidate.json
      - run: npm run check
      - run: npm run package
